# Opens a PR automatically when a brag/YYYY-MM branch is pushed.
# Requires: Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
name: Brag PR
on:
  push:
    branches: ['brag/**']
permissions:
  contents: read
  pull-requests: write
jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open PR if none exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          existing=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh pr create -R "$GITHUB_REPOSITORY" --head "$BRANCH" --base main \
              --title "Brag: ${BRANCH#brag/}" \
              --body "Monthly brag entries for ${BRANCH#brag/}. Review wording, flip \`highlight\`, then merge."
          fi
